services:
    backend:
        build:
            context: ./backend # ← point to the backend subfolder
            dockerfile: Dockerfile
        ports:
            - "8080:80" # nginx is now inside the container on port 80
        environment:
            APP_NAME: "Pure Wear"
            APP_ENV: local
            APP_KEY: "base64:your-key-here"
            APP_DEBUG: "true"
            APP_URL: "http://localhost:8080"
            DB_CONNECTION: mysql
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: purewear
            DB_USERNAME: purewear
            DB_PASSWORD: secret
            SESSION_DRIVER: database
            CACHE_STORE: database
            QUEUE_CONNECTION: sync
            LOG_CHANNEL: stderr
        volumes:
            - ./backend/storage:/var/www/storage
        depends_on:
            db:
                condition: service_healthy

    db:
        image: mysql:8.0
        environment:
            MYSQL_DATABASE: purewear
            MYSQL_USER: purewear
            MYSQL_PASSWORD: secret
            MYSQL_ROOT_PASSWORD: rootsecret
        ports:
            - "3306:3306"
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 10

volumes:
    db_data:
